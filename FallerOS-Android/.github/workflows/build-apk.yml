name: Zbuduj APK Faller'OS

# Buduje APK w chmurze GitHuba.
# Uruchamia się automatycznie po wypchnięciu zmian do main/master
# oraz ręcznie z zakładki Actions.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Zainstaluj JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Zainstaluj Android SDK
        uses: android-actions/setup-android@v4

      - name: Nadaj uprawnienia Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Zbuduj APK (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Udostępnij APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: FallerOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
