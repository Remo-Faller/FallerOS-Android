<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaFlow</title>
  <style>
    :root {
      --bg: #0a0714;
      --bg2: #1b1230;
      --panel: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.12);
      --accent: #8b5cf6;
      --accent-2: #c084fc;
      --text: #f5f3ff;
      --muted: #d4c7ff;
      --shadow: rgba(139, 92, 246, 0.42);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg) 55%);
      color: var(--text);
    }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 30px 28px;
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(18px);
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(192,132,252,0.5);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(139, 92, 246, 0.1);
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }
    .cta {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(139, 92, 246, 0.45);
    }
    .cta:hover { filter: brightness(1.04); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Android app</div>
    <h1>NovaFlow</h1>
    <p>
      This is a new Android app created from the existing project structure and repurposed as a clean lightweight launcher experience.
    </p>
    <button class="cta" onclick="document.body.style.background = 'radial-gradient(circle at top, #2b184f, #0a0714 60%)';">Launch</button>
  </div>
</body>
</html>
