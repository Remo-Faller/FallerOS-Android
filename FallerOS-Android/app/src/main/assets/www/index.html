registerApp('snake','Wąż','🐍', function(){
  const rec = openWindow({app:'snake', title:'Wąż', icon:'🐍', width:340, height:430, render(body){
    body.innerHTML = `<div class="game-wrap">
      <b id="sn-score">Wynik: 0</b>
      <canvas id="sn-canvas" width="280" height="280" style="background:rgba(255,255,255,.05);border-radius:8px;"></canvas>
      <div class="empty-hint">Strzałki / WASD lub przyciski poniżej</div>
      <div style="display:grid;grid-template-columns:repeat(3,40px);gap:4px;">
        <span></span><button class="btn" data-d="up">↑</button><span></span>
        <button class="btn" data-d="left">←</button><button class="btn" id="sn-reset">⟳</button><button class="btn" data-d="right">→</button>
        <span></span><button class="btn" data-d="down">↓</button><span></span>
      </div>
    </div>`;
    const cv = body.querySelector('#sn-canvas'); const ctx=cv.getContext('2d');
    const scoreEl = body.querySelector('#sn-score');
    const cell=14, cols=20, rows=20;
    let snake, dir, nextDir, food, score, timer, over;
    function init(){
      snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dir={x:1,y:0}; nextDir=dir; score=0; over=false;
      placeFood(); scoreEl.textContent='Wynik: 0';
      clearInterval(timer); timer=setInterval(tick,130);
      draw();
    }
    function placeFood(){ food={x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)}; }
    function tick(){
      if(over) return;
      dir=nextDir;
      const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
      if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
        over=true; clearInterval(timer); scoreEl.textContent='Koniec gry — wynik: '+score; return;
      }
      snake.unshift(head);
      if(head.x===food.x && head.y===food.y){ score+=10; scoreEl.textContent='Wynik: '+score; placeFood(); }
      else snake.pop();
      draw();
    }
    function draw(){
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.fillStyle='#00C2A8'; ctx.fillRect(food.x*cell,food.y*cell,cell-2,cell-2);
      ctx.fillStyle='#6C63FF';
      snake.forEach((s,i)=>{ ctx.globalAlpha = i===0?1:0.75; ctx.fillRect(s.x*cell,s.y*cell,cell-2,cell-2); });
      ctx.globalAlpha=1;
    }
    function setDir(x,y){ if(dir.x===-x&&dir.y===-y) return; nextDir={x,y}; }
    document.addEventListener('keydown', function handler(e){
      if(!document.body.contains(body)) { document.removeEventListener('keydown',handler); return; }
      const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
      if(map[e.key]){ e.preventDefault(); setDir(map[e.key][0],map[e.key][1]); }
    });
    body.querySelectorAll('[data-d]').forEach(b=>{
      const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.d];
      b.onclick=()=>setDir(m[0],m[1]);
    });
    body.querySelector('#sn-reset').onclick=init;
    init();
  }});
  return rec;
});

})();
</script>
<script>
/* =========================================================================
   ASYSTENT AI — sterowanie systemem, tłumaczenie, czytanie na głos
   Uwaga: to lokalny asystent oparty na regułach (bez modelu językowego),
   ponieważ ten plik działa całkowicie autonomicznie w przeglądarce, bez
   klucza API. Tłumaczenie korzysta z darmowego publicznego API MyMemory
   (wymaga połączenia z internetem), a czytanie na głos — z wbudowanego
   w przeglądarkę Web Speech API (działa offline).
   ========================================================================= */
(function(){
"use strict";
const log = document.getElementById('ai-log');
const S = window.NimbusSettings;

const APP_ALIASES = {
  'terminal':'terminal','konsola':'terminal','cmd':'terminal',
  'notatnik':'editor','edytor':'editor','edytor tekstu':'editor',
  'menedżer plików':'files','pliki':'files','eksplorator':'files','folder':'files',
  'kalkulator':'calc','liczydło':'calc',
  'muzyk':'music','odtwarzacz muzyki':'music','muzyka':'music','piosenk':'music',
  'wideo':'video','film':'video','odtwarzacz wideo':'video',
  'zdjęci':'photos','galeria':'photos','fotograf':'photos','obraz':'photos',
  'personalizacj':'theme','motyw':'theme','wygląd':'theme','tapet':'theme',
  'kółko i krzyżyk':'ttt','kolko i krzyzyk':'ttt','tic tac toe':'ttt',
  '2048':'game2048',
  'saper':'minesweeper','miny':'minesweeper',
  'wąż':'snake','waz':'snake','snake':'snake',
  'python':'pyconsole','konsola python':'pyconsole','kod':'pyconsole','skrypt':'pyconsole',
};
function findApp(text){
  text = text.toLowerCase();
  for(const key in APP_ALIASES){ if(text.includes(key)) return APP_ALIASES[key]; }
  for(const id in window.NimbusApps){ if(text.includes(window.NimbusApps[id].name.toLowerCase())) return id; }
  return null;
}

function addMsg(text, who){
  const d = document.createElement('div'); d.className='ai-msg '+(who||'bot');
  d.innerText = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
addMsg('Cześć! Jestem FallerAI 🤖. Mogę np.:\n• „otwórz kalkulator”\n• „zmień motyw na jasny”\n• „ustaw tapetę ocean”\n• „przetłumacz dzień dobry na angielski”\n• „przeczytaj na głos: witaj w Faller\'OS”', 'bot');

async function translateText(text, targetLangHint){
  const langMap = {
    'angielski':'en','english':'en','niemiecki':'de','francuski':'fr','hiszpański':'es','hiszpanski':'es',
    'włoski':'it','wloski':'it','rosyjski':'ru','ukraiński':'uk','ukrainski':'uk','polski':'pl','portugalski':'pt',
    'chiński':'zh','chinski':'zh','japoński':'ja','japonski':'ja',
  };
  let target = 'en';
  for(const k in langMap){ if((targetLangHint||'').toLowerCase().includes(k)){ target=langMap[k]; break; } }
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=pl|${target}`);
    const data = await res.json();
    return data && data.responseData ? data.responseData.translatedText : null;
  }catch(e){ return null; }
}

function speak(text){
  if(!('speechSynthesis' in window)){ addMsg('Przepraszam, ta przeglądarka nie obsługuje syntezatora mowy.', 'bot'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang='pl-PL';
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function handleCommand(raw){
  const text = raw.trim();
  const low = text.toLowerCase();

  // otwieranie aplikacji
  if(/^(otwórz|otworz|uruchom|włącz|wlacz)\b/.test(low)){
    const appId = findApp(low);
    if(appId){ window.NimbusApps[appId].open(); addMsg('Otwieram: '+window.NimbusApps[appId].name+' ✅','bot'); }
    else addMsg('Nie rozpoznaję takiej aplikacji. Dostępne: '+Object.values(window.NimbusApps).map(a=>a.name).join(', '), 'bot');
    return;
  }
  // motyw
  if(low.includes('motyw') || low.includes('tryb ciemny') || low.includes('tryb jasny')){
    let th=null;
    if(low.includes('jasn')) th='light'; else if(low.includes('ciemn')) th='dark'; else if(low.includes('kontrast')) th='contrast';
    if(th){ S.SETTINGS.theme=th; S.saveSettings(); S.applyTheme(); addMsg('Zmieniono motyw na: '+th+' ✅','bot'); return; }
  }
  // tapeta
  if(low.includes('tapet')){
    const found = Object.keys(S.WALLPAPERS).find(k=> low.includes(k) || (k==='ocean'&&low.includes('ocean')) || (k==='forest'&&(low.includes('las')||low.includes('leś'))) || (k==='sunset'&&low.includes('zachód')) || (k==='mono'&&low.includes('mono')) || (k==='nebula'&&low.includes('nebul')));
    if(found){ S.SETTINGS.wallpaperPreset=found; S.SETTINGS.customWallpaper=null; S.saveSettings(); S.applyTheme(); addMsg('Ustawiono tapetę: '+found+' ✅','bot'); return; }
    window.NimbusApps.theme.open();
    addMsg('Otwieram Personalizację, żebyś mógł wybrać tapetę.', 'bot'); return;
  }
  // tłumaczenie: "przetłumacz X na Y" / "przetłumacz: X"
  let m = low.match(/przetłumacz(?:y)?\s+(.*?)\s+na\s+([a-ząćęłńóśźż]+)\s*$/i) || low.match(/przetlumacz(?:y)?\s+(.*?)\s+na\s+([a-ząćęłńóśźż]+)\s*$/i);
  if(!m) m = low.match(/przet[łl]umacz:?\s+(.*)/i);
  if(low.startsWith('przetłumacz') || low.startsWith('przetlumacz')){
    let phrase, targetHint='angielski';
    const m2 = text.match(/przet[łl]umacz(?:y)?[:]?\s+(.*?)(?:\s+na\s+(\w+))?$/i);
    if(m2){ phrase=m2[1]; if(m2[2]) targetHint=m2[2]; }
    if(!phrase){ addMsg('Napisz np.: „przetłumacz dzień dobry na angielski”.', 'bot'); return; }
    addMsg('Tłumaczę…', 'bot');
    const result = await translateText(phrase, targetHint);
    if(result) addMsg('Tłumaczenie: '+result, 'bot');
    else addMsg('Nie udało się połączyć z usługą tłumaczenia (sprawdź internet).', 'bot');
    return;
  }
  // czytanie na głos
  if(low.startsWith('przeczytaj')){
    const phrase = text.replace(/^przeczytaj( na głos)?:?\s*/i,'');
    if(!phrase){ addMsg('Napisz np.: „przeczytaj na głos: witaj w Faller\'OS”.', 'bot'); return; }
    speak(phrase);
    addMsg('🔊 Czytam: „'+phrase+'”', 'bot');
    return;
  }
  // rozmiar czcionki
  if(low.includes('powiększ') && low.includes('czcionk')){ S.SETTINGS.fontScale=Math.min(1.3,S.SETTINGS.fontScale+0.1); S.saveSettings(); S.applyTheme(); addMsg('Powiększono czcionkę.','bot'); return; }
  if(low.includes('pomniejsz') && low.includes('czcionk')){ S.SETTINGS.fontScale=Math.max(0.85,S.SETTINGS.fontScale-0.1); S.saveSettings(); S.applyTheme(); addMsg('Pomniejszono czcionkę.','bot'); return; }

  // domyślnie spróbuj rozpoznać nazwę aplikacji w zdaniu
  const appId = findApp(low);
  if(appId){ window.NimbusApps[appId].open(); addMsg('Otwieram: '+window.NimbusApps[appId].name+' ✅','bot'); return; }

  addMsg('Mogę: otwierać aplikacje, zmieniać motyw/tapetę, tłumaczyć tekst i czytać na głos. Spróbuj np. „otwórz notatnik” albo „przeczytaj na głos: cześć”.', 'bot');
}

  document.getElementById('ai-panel').classList.toggle('open');
};
document.getElementById('lock-btn').onclick = ()=>{
  document.getElementById('ai-panel').classList.remove('open');
  document.getElementById('start-menu').classList.remove('open');
  window.NimbusAuth.lock();
};
document.getElementById('ai-send').onclick = send;
document.getElementById('ai-input').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
function send(){
  const inp = document.getElementById('ai-input');
  const val = inp.value.trim(); if(!val) return;
  addMsg(val,'me'); inp.value='';
  handleCommand(val);
}
})();

<script>
/* =========================================================================
   PYTHON — silnik wykonawczy (Pyodide, WebAssembly) + Konsola Python
   Pyodide jest doczytywany leniwie z CDN dopiero przy pierwszym użyciu
   (wymaga wtedy połączenia z internetem; potem przeglądarka go cache'uje).
   ========================================================================= */
(function(){
"use strict";
const { openWindow } = window.NimbusWM;
const { getNode, createFile } = window.NimbusFS;

const LS_PYPKGS = 'fallers_py_packages_v1';
function lsGetRaw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSetRaw(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function safeParseJ(s,fb){ try{ return JSON.parse(s); }catch(e){ return fb; } }
function getSavedPackages(){ return safeParseJ(lsGetRaw(LS_PYPKGS), []); }
function saveSavedPackages(arr){ lsSetRaw(LS_PYPKGS, JSON.stringify(arr)); }

function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector('script[data-src="'+src+'"]')){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.dataset.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Nie udało się pobrać środowiska Python (sprawdź połączenie z internetem).'));
    document.head.appendChild(s);
  });
}

let pyodidePromise = null;
function ensurePyodide(onStatus){
  if(pyodidePromise) return pyodidePromise;
  pyodidePromise = (async ()=>{
    onStatus && onStatus('⏳ Pobieranie środowiska Python (Pyodide)… to nastąpi tylko raz.');
    await loadScriptOnce('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
    const pyodide = await window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    onStatus && onStatus('⏳ Ładowanie pakietu micropip…');
    try{ await pyodide.loadPackage(['micropip']); }catch(e){ /* opcjonalne */ }
    const saved = getSavedPackages();
    if(saved.length){
      onStatus && onStatus('⏳ Doinstalowywanie zapisanych pakietów: '+saved.join(', ')+'…');
      try{
        const micropip = pyodide.pyimport('micropip');
        await micropip.install(saved);
      }catch(e){ onStatus && onStatus('⚠️ Nie udało się doinstalować części zapisanych pakietów: '+(e.message||e)); }
    }
    onStatus && onStatus('✅ Python gotowy.');
    return pyodide;
  })();
  return pyodidePromise;
}

async function installPackage(name, onStatus){
  name = (name||'').trim();
  if(!name) return {ok:false, error:'Podaj nazwę pakietu.'};
  const pyodide = await ensurePyodide(onStatus);
  onStatus && onStatus('📦 Instalowanie pakietu: '+name+'…');
  try{
    const micropip = pyodide.pyimport('micropip');
    await micropip.install(name);
    const saved = getSavedPackages();
    const bare = name.split(/[<>=! ]/)[0];
    if(!saved.includes(name) && !saved.includes(bare)){ saved.push(name); saveSavedPackages(saved); }
    onStatus && onStatus('✅ Zainstalowano: '+name);
    return {ok:true};
  }catch(e){
    const msg = e && e.message ? e.message : String(e);
    onStatus && onStatus('❌ Błąd instalacji: '+msg);
    return {ok:false, error:msg};
  }
}
function listPackages(){ return getSavedPackages(); }
function removePackage(name){ saveSavedPackages(getSavedPackages().filter(p=>p!==name)); }

window.NimbusPython = { ensurePyodide, installPackage, listPackages, removePackage };

async function runPythonCode(code, onStatus){
  const pyodide = await ensurePyodide(onStatus);
  let buf = '';
  pyodide.setStdout({ batched:(s)=>{ buf += s + '\n'; } });
  pyodide.setStderr({ batched:(s)=>{ buf += s + '\n'; } });
  let error = null, value;
  try{
    value = await pyodide.runPythonAsync(code);
  }catch(e){
    error = e.message || String(e);
  }finally{
    pyodide.setStdout({}); pyodide.setStderr({});
  }
  return { output: buf, error, value };
}
window.NimbusPython.run = runPythonCode;

/* --------------------------- KONSOLA PYTHON --------------------------- */
registerApp('pyconsole','Konsola Python','🐍', function(openPath){
  const rec = openWindow({app:'pyconsole', title: openPath ? openPath[openPath.length-1] : 'Konsola Python', icon:'🐍', width:600, height:480, render(body,r){
    body.innerHTML = `
      <div style="display:flex;flex-direction:column;height:100%;">
        <div style="display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--win-border);flex-wrap:wrap;">
          <button class="btn primary" data-a="run">▶ Uruchom (Ctrl+Enter)</button>
          <button class="btn" data-a="clear">Wyczyść konsolę</button>
          <button class="btn" data-a="save">💾 Zapisz jako .py</button>
          <button class="btn" data-a="pip">📦 Zainstaluj pakiet</button>
          <button class="btn" data-a="pkgs">📃 Pakiety</button>
          <span id="py-status" style="font-size:11px;color:var(--text-dim);align-self:center;margin-left:auto;">Python nie jest jeszcze załadowany</span>
        </div>
        <textarea class="ta" id="py-code" style="flex:2;min-height:0;border:none;border-radius:0;padding:12px;"></textarea>
        <div class="term" id="py-out" style="flex:1;min-height:70px;border-top:1px solid var(--win-border);"></div>
      </div>`;
    const codeEl = body.querySelector('#py-code');
    const outEl = body.querySelector('#py-out');
    const statusEl = body.querySelector('#py-status');
    let curPath = openPath ? openPath.slice() : null;

    if(curPath){ const n=getNode(curPath); codeEl.value = n ? n.content : ''; }
    else {
      codeEl.value = "# Witaj w Konsoli Python (Faller'OS)!\n# Wpisz kod i kliknij Uruchom (albo Ctrl+Enter).\n\nfor i in range(5):\n    print('Cześć z Pythona', i)\n\nimport math\nprint('pierwiastek z 2 =', math.sqrt(2))\n";
    }

    function pr(text, cls){
      const d=document.createElement('div'); d.className='term-line'; if(cls) d.style.color=cls;
      d.textContent=text; outEl.appendChild(d); outEl.scrollTop=outEl.scrollHeight;
    }
    function setStatus(t){ statusEl.textContent=t; }

    async function run(){
      const code = codeEl.value;
      pr('▶ Uruchamianie…', '#c98bff');
      const res = await window.NimbusPython.run(code, setStatus);
      if(res.output) pr(res.output.replace(/\n$/,''));
      if(res.error) pr('❌ '+res.error, '#ff8b8b');
      if(!res.output && !res.error) pr('(brak wyjścia)', 'var(--text-dim)');
      setStatus('✅ Python gotowy.');
    }
    function save(){
      const name = prompt('Zapisz jako:', curPath ? curPath[curPath.length-1] : 'skrypt.py'); if(!name) return;
      createFile(['Dokumenty'], name, 'py', codeEl.value, 'text/x-python');
      curPath = ['Dokumenty', name];
      r.el.querySelector('.ttl').textContent = name;
      window.renderDesktopIcons();
      pr('💾 Zapisano jako '+name, 'var(--text-dim)');
    }
    body.querySelector('[data-a=run]').onclick = run;
    body.querySelector('[data-a=clear]').onclick = ()=>{ outEl.innerHTML=''; };
    body.querySelector('[data-a=save]').onclick = save;
    body.querySelector('[data-a=pip]').onclick = async ()=>{
      const name = prompt('Nazwa pakietu do zainstalowania (np. numpy, pandas, requests):'); if(!name) return;
      pr('📦 Instaluję pakiet: '+name+'…', '#c98bff');
      const res = await window.NimbusPython.installPackage(name, setStatus);
      pr(res.ok ? '✅ Zainstalowano: '+name+' (zostanie doinstalowany automatycznie przy każdym kolejnym uruchomieniu Pythona)' : '❌ Błąd: '+res.error, res.ok ? 'var(--text-dim)' : '#ff8b8b');
      setStatus('✅ Python gotowy.');
    };
    body.querySelector('[data-a=pkgs]').onclick = ()=>{
      const list = window.NimbusPython.listPackages();
      pr(list.length ? '📃 Zainstalowane pakiety: '+list.join(', ') : '📃 Brak zainstalowanych pakietów. Użyj „📦 Zainstaluj pakiet”.', 'var(--text-dim)');
    };
    codeEl.addEventListener('keydown', e=>{
      if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); run(); }
      if((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); save(); }
    });

    pr('🐍 Konsola Python — środowisko Pyodide doczyta się automatycznie przy pierwszym uruchomieniu kodu.', 'var(--text-dim)');
    if(openPath) setTimeout(run, 150);
  }});
  return rec;
});

})();
</script>

<script>

(function(){
  "use strict";
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').then(reg=>{
        console.log('Faller\'OS: service worker zarejestrowany', reg.scope);
      }).catch(err=>{
        console.log('Faller\'OS: rejestracja service workera nie powiodła się (prawdopodobnie strona otwarta z pliku lokalnego bez serwera).', err);
      });
    });
  }

  const installBtn = document.getElementById('install-btn');
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'flex';
  });

  installBtn.addEventListener('click', async ()=>{
    if(!deferredPrompt) return;
    installBtn.style.display='none';
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', ()=>{
    installBtn.style.display='none';
    deferredPrompt=null;
  });

  // jeżeli aplikacja już działa jako zainstalowana (standalone) — nie pokazuj przycisku
  if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true){
    installBtn.style.display='none';
  }
})();
</script>
