name: Zbuduj APK Faller'OS

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Pobierz kod
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Sprawdź Android SDK dostępne na runnerze
      # --------------------------------------------------
      - name: Sprawdź Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Zainstalowane platformy:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo
          echo "Zainstalowane build-tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      # --------------------------------------------------
      # 4. Znajdź Gradle Wrapper
      # --------------------------------------------------
      - name: Znajdź Gradle Wrapper
        shell: bash
        run: |
          echo "Szukam pliku gradlew..."

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "::error::Nie znaleziono pliku gradlew."
            echo
            echo "Struktura projektu:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Znaleziono: $GRADLEW"

          GRADLE_DIR=$(dirname "$GRADLEW")
          GRADLE_DIR="${GRADLE_DIR#./}"

          if [ "$GRADLE_DIR" = "." ]; then
            GRADLE_DIR=""
          fi

          echo "Katalog projektu Gradle: ${GRADLE_DIR:-.}"

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Nadaj prawa Gradle Wrapper
      # --------------------------------------------------
      - name: Nadaj uprawnienia Gradle Wrapper
        shell: bash
        run: |
          if [ -n "$GRADLE_DIR" ]; then
            chmod +x "$GRADLE_DIR/gradlew"
          else
            chmod +x ./gradlew
          fi

      # --------------------------------------------------
      # 6. Zaakceptuj licencje Android SDK
      # --------------------------------------------------
      - name: Zaakceptuj licencje Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # --------------------------------------------------
      # 7. Zbuduj APK
      # --------------------------------------------------
      - name: Zbuduj APK
        shell: bash
        working-directory: ${{ env.GRADLE_DIR || '.' }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      # --------------------------------------------------
      # 8. Pokaż wygenerowane APK
      # --------------------------------------------------
      - name: Znajdź wygenerowane APK
        shell: bash
        run: |
          echo "=== Wygenerowane pliki APK ==="

          find . \
            -type f \
            -name "*.apk" \
            -print

      # --------------------------------------------------
      # 9. Udostępnij APK jako artefakt
      # --------------------------------------------------
      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: FallerOS-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
