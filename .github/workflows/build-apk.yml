name: Zbuduj APK Faller'OS

# Buduje APK w chmurze GitHuba — nie wymaga Android Studio ani SDK
# na Twoim komputerze. Uruchamia się automatycznie po wypchnięciu zmian
# do gałęzi main/master, a także ręcznie z zakładki "Actions".

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Zainstaluj JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Zainstaluj Android SDK
        uses: android-actions/setup-android@v4

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Zbuduj APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Udostępnij APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: FallerOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
