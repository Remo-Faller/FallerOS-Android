name: Zbuduj APK Faller'OS

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Pobranie repozytorium
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3

      # 4. Sprawdzenie struktury projektu
      - name: Znajdź Gradle Wrapper
        shell: bash
        run: |
          echo "Katalog repozytorium:"
          pwd

          echo
          echo "Zawartość repozytorium:"
          find . -maxdepth 3 -type f | sort | head -300

          echo
          echo "Szukam gradlew..."

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "::error::Nie znaleziono pliku gradlew!"
            echo "Projekt Android musi zawierać Gradle Wrapper."
            exit 1
          fi

          echo "Znaleziono: $GRADLEW"

          GRADLE_DIR=$(dirname "$GRADLEW")

          # Usunięcie ./ z początku ścieżki
          GRADLE_DIR="${GRADLE_DIR#./}"

          echo "Katalog projektu Android: $GRADLE_DIR"

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      # 5. Nadanie praw wykonywania
      - name: Nadaj uprawnienia Gradle Wrapper
        shell: bash
        run: |
          chmod +x "$GRADLE_DIR/gradlew"

      # 6. Zbudowanie APK
      - name: Zbuduj APK
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      # 7. Znalezienie wygenerowanego APK
      - name: Znajdź APK
        shell: bash
        run: |
          echo "Wygenerowane pliki APK:"

          find "$GRADLE_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 8. Udostępnienie APK jako artefaktu GitHub Actions
      - name: Zapisz APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: FallerOS-debug-APK
          path: |
            ${{ env.GRADLE_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
